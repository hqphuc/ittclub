<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang chủ - ITT Club</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            text-align: center;
        }
        header {
            background-color: #2196F3;
            color: white;
            padding: 20px 0;
        }
        main {
            flex: 1;
            padding: 50px 20px;
        }
        .btn {
            display: inline-block;
            margin: 10px;
            padding: 12px 24px;
            color: white;
            background-color: #4CAF50;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            font-family: inherit;
            transition: background-color 0.3s;
        }
        .btn:hover {
            background-color: #45a049;
        }
        footer {
            background-color: #333;
            color: white;
            padding: 20px 0;
            line-height: 1.6;
            margin-top: auto;
        }
    </style>
</head>
<body>

    <header>
        <h1>Itt Club</h1>
    </header>

    <main>
        <h2>Bài tập</h2>
        <!-- Sử dụng thẻ button kết hợp JavaScript cơ bản để chuyển hướng -->
        <button class="btn" onclick="window.location.href='https://hqphuc.github.io/ittclub/halloween01.html'">Hứng kẹo Halloween</button>
        <button class="btn" onclick="window.location.href='https://hqphuc.github.io/ittclub/halloween02.html'">Halloween Shooting</button>
        <button class="btn" href='https://hqphuc.github.io/ittclub/Luyen-go-ban-phim.html'">Luyện gõ bàn phím</button>
        <button class="btn" onclick="window.location.href='#'">......</button>
    </main>

    <footer>
        CÂU LẠC BỘ TIN HỌC TRẺ - ITT CLUB <br> 
        Chủ nhiệm CLB: Hồ Quang Phúc
    </footer>

</body>
</html>

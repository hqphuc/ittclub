<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang chủ - ITT Club</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            text-align: center;
        }
        header {
            background-color: #ffffff;
            padding: 0;
            margin: 0;
        }
        .banner {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 0 auto;
        }
        main {
            flex: 1;
            padding: 40px 20px;
        }
        .btn {
            display: inline-block;
            margin: 10px;
            padding: 12px 24px;
            color: white;
            background-color: #4CAF50;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            font-family: inherit;
            transition: background-color 0.3s;
        }
        .btn:hover {
            background-color: #45a049;
        }
        footer {
            background-color: #333;
            color: white;
            padding: 20px 0;
            line-height: 1.6;
            margin-top: auto;
        }
    </style>
</head>
<body>

    <header>
        <img src="https://i.ibb.co/fGM1crXt/banner-01.png" alt="Banner ITT Club" class="banner">
    </header>

    <main>
        <h2>Bài tập</h2>
        <!-- Thêm '_blank' vào lệnh window.open để mở tab mới -->
        <button class="btn" onclick="window.open('https://hqphuc.github.io/ittclub/halloween01.html', '_blank')">Hứng kẹo Halloween</button>
        <button class="btn" onclick="window.open('https://hqphuc.github.io/ittclub/halloween02.html', '_blank')">Halloween Shooting</button>
        <button class="btn" onclick="window.open('https://hqphuc.github.io/ittclub/Luyen-go-ban-phim.html', '_blank')">Luyện gõ bàn phím</button>
        <button class="btn" onclick="window.open('https://hqphuc.github.io/ittclub/ecoland.html', '_blank')">ECOLAND</button>
        <button class="btn" onclick="window.open('https://hqphuc.github.io/ittclub/nhanhtaylemat.html', '_blank')">NHANH TAY LẸ MẮT</button>
    </main>

    <footer>
        CÂU LẠC BỘ TIN HỌC TRẺ - ITT CLUB <br> 
        Chủ nhiệm CLB: Hồ Quang Phúc
    </footer>

</body>
</html>
